<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neev is Turning 14! - Press Start to Party</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #2ba6ef; font-family: 'Press Start 2P', monospace; color: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .invitation-card { width: 100%; max-width: 550px; height: 100vh; height: 100dvh; background: linear-gradient(to bottom, #41d1ff 0%, #38b6ff 50%, #76e1ff 100%); border: 6px solid #000; position: relative; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .rsvp-link { display: inline-block; background: #00ff00; color: #000; padding: 12px 18px; font-size: 12px; border: 3px solid #000; text-decoration: none; box-shadow: 3px 3px 0px #000; transition: transform 0.1s; margin-top: 5px; }
        .rsvp-link:active { transform: translateY(3px); box-shadow: 0px 0px 0px #000; }
        .content-wrapper { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; width: 100%; padding-top: 20px; padding-bottom: 20px; }
        .press-start { font-size: 15px; color: #ffffff; text-shadow: 2px 2px #000000; letter-spacing: 1px; animation: blink 1.2s infinite steps(1); text-align: center; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        .title-box { background-color: #f37022; border: 4px solid #000000; border-radius: 12px; width: 90%; padding: 22px 10px; text-align: center; box-shadow: inset -5px -5px 0px rgba(0,0,0,0.25); }
        .title-box h1 { font-size: 28px; color: #0b0b0b; margin-bottom: 12px; letter-spacing: 1px; }
        .title-box h2 { font-size: 16px; color: #ffffff; text-shadow: 2px 2px #000; }
        .controller-section { display: flex; flex-direction: column; align-items: center; position: relative; width: 100%; transform: scale(1.1); }
        .controller-wrapper { display: flex; align-items: center; justify-content: center; position: relative; }
        .sparkle-left, .sparkle-right { font-size: 16px; color: #ffde00; text-shadow: 1px 1px #ff6600; position: absolute; animation: pulse-sparkle 1.5s infinite ease-in-out; }
        .sparkle-left { left: 45px; } .sparkle-right { right: 45px; }
        @keyframes pulse-sparkle { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.3); opacity: 1; } }
        .game-controller { width: 130px; height: 60px; background-color: #00b000; border: 4px solid #000000; border-radius: 35px; position: relative; box-shadow: inset -4px -4px 0px rgba(0, 50, 0, 0.4); display: flex; justify-content: space-between; align-items: center; padding: 0 12px; }
        .d-pad { width: 26px; height: 26px; background: #111; position: relative; clip-path: polygon(35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0% 65%, 0% 35%, 35% 35%); }
        .d-pad::after { content: ''; position: absolute; top: 9px; left: 9px; width: 8px; height: 8px; background: #ffde00; }
        .action-buttons { display: grid; grid-template-columns: repeat(2, 10px); grid-gap: 3px; }
        .ab-btn { width: 10px; height: 10px; background-color: #ffde00; border: 2px solid #000; border-radius: 50%; }
        .datetime { font-size: 13px; color: #0b0b0b; text-align: center; line-height: 1.8; font-weight: bold; }
        .info-section { display: flex; justify-content: space-between; align-items: center; width: 95%; padding: 0 10px; font-size: 11px; }
        .location-box { text-align: left; width: 48%; font-weight: bold; line-height: 1.8; }
        .rsvp-box { text-align: right; width: 50%; font-weight: bold; display: flex; flex-direction: column; align-items: flex-end; }
        .click-instruction { display: block; margin-top: 6px; color: #ffde00; font-size: 8px; text-shadow: 1px 1px #000; line-height: 1.4; }
        .stage-container { width: 100%; position: relative; height: 160px; flex-shrink: 0; }
        .bush-left, .bush-right { position: absolute; bottom: 45px; width: 70px; height: 35px; background: #00aa00; border: 3px solid #000; border-radius: 35px 35px 0 0; z-index: 2; transform: scale(1.5); }
        .bush-left { left: 15px; transform-origin: bottom left; } .bush-right { right: 15px; transform-origin: bottom right; }
        .brick-wall { position: absolute; bottom: 0; width: 100%; height: 48px; background-color: #b53800; border-top: 5px solid #000; background-image: linear-gradient(90deg, #000 4px, transparent 4px), linear-gradient(0deg, #000 4px, transparent 4px); background-size: 45px 24px; z-index: 5; }
        .creator-credit { position: absolute; bottom: 6px; right: 12px; font-size: 7px; color: #ffffff; text-shadow: 1px 1px 0px #000000; z-index: 10; }
        
        .wickets { position: absolute; bottom: 48px; left: 8%; width: 14px; height: 40px; z-index: 3; }
        .stump { position: absolute; bottom: 0; width: 4px; height: 40px; background: #e6a817; border: 2px solid #000; }
        .stump.left { left: -2px; } .stump.middle { left: 5px; } .stump.right { left: 12px; }
        .bail { position: absolute; top: -3px; left: -1px; width: 16px; height: 4px; background: #e6a817; border: 2px solid #000; }

        #cricket-ball { position: absolute; width: 10px; height: 10px; background-color: #d32f2f; border: 2px solid #000; border-radius: 50%; z-index: 6; display: none; box-shadow: inset 2px 0 0 rgba(255,255,255,0.4); }

        #pixel-boy { position: absolute; bottom: 48px; left: 24%; width: 50px; height: 80px; z-index: 4; transform: translateX(-50%) scale(1.6); transform-origin: bottom center; }
        .pb-hair { position: absolute; top: 0; left: 14px; width: 22px; height: 8px; background: #0d3b66; border: 2px solid #000; z-index: 3;}
        .pb-head { position: absolute; top: 6px; left: 16px; width: 18px; height: 18px; background: #ffcda2; border: 2px solid #000; border-top: none; z-index: 2;}
        .pb-glasses { position: absolute; top: 10px; left: 12px; width: 30px; height: 8px; background: #000; z-index: 4;}
        .pb-glasses::after { content: ''; position: absolute; top: 2px; left: 4px; width: 4px; height: 2px; background: #fff; box-shadow: 14px 0 0 #fff; }
        .pb-body { position: absolute; top: 24px; left: 14px; width: 22px; height: 24px; background: #009900; border: 2px solid #000; z-index: 3;}
        .pb-body::after { content: ''; position: absolute; top: 4px; left: 8px; width: 4px; height: 4px; background: #ffde00; box-shadow: 0 8px 0 #ffde00; }
        .pb-belt { position: absolute; top: 48px; left: 14px; width: 22px; height: 6px; background: #111; border-left: 2px solid #000; border-right: 2px solid #000; z-index: 4;}
        .pb-buckle { position: absolute; top: 48px; left: 21px; width: 8px; height: 6px; background: #ffde00; border: 2px solid #000; z-index: 4;}
        .pb-leg-left, .pb-leg-right { position: absolute; top: 54px; width: 9px; height: 20px; background: #1d1d4f; border: 2px solid #000; transform-origin: top center; z-index: 2; }
        .pb-leg-left { left: 14px; transform: rotate(-15deg); } .pb-leg-right { left: 27px; transform: rotate(15deg); }
        .pb-shoe { position: absolute; bottom: -6px; left: -2px; width: 12px; height: 6px; background: #ffde00; border: 2px solid #000; }
        .pb-arm-left, .pb-arm-right { position: absolute; top: 24px; width: 8px; height: 16px; background: #009900; border: 2px solid #000; border-top: none; transform-origin: top center; transition: transform 0.08s ease-out; }
        .pb-arm-left { left: 10px; transform: rotate(-45deg); z-index: 1; }
        .pb-arm-right { right: 8px; transform: rotate(-30deg); z-index: 6; }
        .pb-hand { position: absolute; bottom: -8px; left: -2px; width: 8px; height: 8px; background: #ffcda2; border: 2px solid #000; }
        .pb-bat-container { position: absolute; top: 30px; left: 24px; transform-origin: top center; transform: rotate(-35deg); transition: transform 0.08s ease-out; z-index: 7; }
        .pb-bat-handle { width: 6px; height: 14px; background: #ddd; border: 2px solid #000; margin: 0 auto; border-bottom: none; }
        .pb-bat { width: 14px; height: 40px; background: #d2691e; border: 2px solid #000; border-radius: 0 0 4px 4px; }
        .swinging .pb-arm-left { transform: rotate(110deg) translateY(5px); }
        .swinging .pb-arm-right { transform: rotate(120deg) translateY(5px); }
        .swinging .pb-bat-container { transform: rotate(115deg) translate(-5px, -15px); }
    </style>
</head>
<body>
    <div class="invitation-card">
        <div class="content-wrapper">
            <div class="press-start">PRESS START TO PARTY</div>
            <div class="title-box">
                <h1>NEEV</h1>
                <h2>IS TURNING 14!</h2>
            </div>
            <div class="controller-section">
                <div class="controller-wrapper">
                    <div class="sparkle-left">✦</div>
                    <div class="game-controller">
                        <div class="d-pad"></div>
                        <div class="action-buttons"><div class="ab-btn"></div><div class="ab-btn"></div><div class="ab-btn"></div><div class="ab-btn"></div></div>
                    </div>
                    <div class="sparkle-right">✦</div>
                </div>
            </div>
            <div class="datetime">AUGUST 23, 2026 | AT 4:30 PM</div>
            <div class="info-section">
                <div class="location-box">ALL INDIA<br>BALKANJI<br>BARI</div>
                <div class="rsvp-box">
                    <a href="https://wa.me/917977046648?text=I%20will%20attend%20Neev's%2014th%20Birthday%20Party" target="_blank" class="rsvp-link">RSVP</a>
                    <span class="click-instruction">click the button above to rsvp</span>
                </div>
            </div>
        </div>
        <div class="stage-container">
            <div class="bush-left"></div><div class="bush-right"></div><div class="brick-wall"></div>
            <div class="creator-credit">made by neev</div>
            <div class="wickets"><div class="stump left"></div><div class="stump middle"></div><div class="stump right"></div><div class="bail"></div></div>
            <div id="cricket-ball"></div>
            <div id="pixel-boy">
                <div class="pb-arm-left"><div class="pb-hand"></div></div>
                <div class="pb-leg-left"><div class="pb-shoe"></div></div>
                <div class="pb-leg-right"><div class="pb-shoe"></div></div>
                <div class="pb-body"></div><div class="pb-belt"></div><div class="pb-buckle"></div>
                <div class="pb-hair"></div><div class="pb-head"></div><div class="pb-glasses"></div>
                <div class="pb-arm-right"><div class="pb-hand"></div></div>
                <div class="pb-bat-container"><div class="pb-bat-handle"></div><div class="pb-bat"></div></div>
            </div>
        </div>
    </div>
    <script>
        const boy = document.getElementById('pixel-boy');
        const ball = document.getElementById('cricket-ball');
        let ballState = 'wait', ballX = 110, ballY = 90, ballSpeedX = 0, ballSpeedY = 0;
        function throwBall() {
            ballState = 'bowled'; ball.style.display = 'block';
            ballX = 110; ballY = 75; ballSpeedX = -1.5; ballSpeedY = -1.0;
        }
        function animateCricket() {
            if (ballState === 'bowled') {
                ballX += ballSpeedX; ballY += ballSpeedY; ballSpeedY -= 0.35;
                if (ballY <= 25) { ballY = 25; ballSpeedY = 6.5; }
                if (ballX <= 38 && !boy.classList.contains('swinging')) { boy.classList.add('swinging'); }
                if (ballX <= 26 && ballX >= 20) { ballState = 'hit'; ballSpeedX = 3.5; ballSpeedY = 8.0; }
            } else if (ballState === 'hit') {
                ballX += ballSpeedX; ballY += ballSpeedY; ballSpeedY -= 0.15;
                if (ballX > 50) { boy.classList.remove('swinging'); }
                if (ballX > 120 || ballY > 300) { ballState = 'wait'; ball.style.display = 'none'; setTimeout(throwBall, 1000); }
            }
            if (ballState !== 'wait') { ball.style.left = ballX + '%'; ball.style.bottom = ballY + 'px'; }
            requestAnimationFrame(animateCricket);
        }
        setTimeout(throwBall, 1000); animateCricket();
    </script>
</body>
</html>
